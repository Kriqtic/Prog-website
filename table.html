<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Table Page</h1>
        </header>
        <section>
            <table class="table table-striped">
                <tr>
                    <th>Attraction</th>
                    <th>Hotel</th>
                    <th>City</th>
                </tr>
                <tr>
                    <td>Disney</td>
                    <td>Hilton Hotel</td>
                    <td>Orlando</td>
                </tr>
                <tr>
                    <td>Empire State Building</td>
                    <td>Ritz-Carlton</td>
                    <td>New York</td>
                </tr>
                <tr>
                    <td>The Sphere</td>
                    <td>The Mirage Hotel</td>
                    <td>Las Vegas</td>
                </tr>
            </table>
        </section>
        <footer>
            <p>2026 Vacation Destinations</p>
        </footer>
    </div>
</body>
</html>
