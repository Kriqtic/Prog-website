<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <header>
            <h1>My About Page</h1>
        </header>
        <section>
            <form method="post" action="https://webdevbasics.net/scripts/demo.php">
                <div class="mb-3">
                    <label for="myName" class="form-label">Name</label>
                    <input type="text" name="myName" id="myName" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="myEmail" class="form-label">Email</label>
                    <input type="text" name="myEmail" id="myEmail" class="form-control">
                </div>
                <div class="mb-3 form-check">
                    Choose the browsers you use:<br>
                    <input type="checkbox" name="Chrome" id="Chrome" value="yes" class="form-check-input">
                    <label for="Chrome" class="form-check-label">Google Chrome</label>
                    <input type="checkbox" name="Firefox" id="Firefox" value="yes" class="form-check-input">
                    <label for="Firefox" class="form-check-label">Firefox</label>
                    <input type="checkbox" name="Edge" id="Edge" value="yes" class="form-check-input">
                    <label for="Edge" class="form-check-label">Microsoft Edge</label>
                </div>
                <div class="mb-3">
                    Would you like to be on our mailing list?<br>
                    <div class="form-check">
                        <input type="radio" name="mailingList" id="mailingListYes" value="yes" class="form-check-input">
                        <label for="mailingListYes" class="form-check-label">Yes</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="mailingList" id="mailingListNo" value="no" class="form-check-input">
                        <label for="mailingListNo" class="form-check-label">No</label>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text">Comments</span>
                    <textarea name="comments" id="comments" class="form-control" aria-label="Comments"></textarea>
                </div>
                <input type="submit" value="Submit" class="btn btn-primary">
                <input type="reset" class="btn btn-secondary">
            </form>
        </section>
    </div>
</body>
</html>
